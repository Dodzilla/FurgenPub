name: Build free V5 H3 worker runtime
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v5-runtime-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free unused SDK disk space on standard public runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Validate H3-only bundle and node contract
        run: python3 docker/vast-v5-cu129/validate_contract.py
      - name: Build and publish software-only H3 runtime
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/dodzilla/furgen-vast-v5:h3-cu129-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --progress=plain --build-arg "FURGENPUB_COMMIT=${GITHUB_SHA}" -f docker/vast-v5-cu129/Dockerfile -t "$image" .
          docker push "$image"
          docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint /bin/cat "$image" /opt/furgen/v5/manifest.json >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
