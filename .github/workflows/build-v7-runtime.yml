name: Build free V7 worker runtime
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: v7-runtime-build
  cancel-in-progress: false
jobs:
  build:
    # Public repository + standard runner: no paid build minutes or larger runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free unused runner SDK disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
          free -h
      - name: Build and publish software-only image to free Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/dodzilla/furgen-vast-v7:cu130-slim-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --progress=plain -f docker/vast-v7-cuda130/Dockerfile.slim -t "$image" docker/vast-v7-cuda130
          docker push "$image"
          docker image inspect "$image" --format '{{join .RepoDigests "\n"}}' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint /usr/bin/sha256sum "$image" /opt/furgen/v7/manifest.json >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
